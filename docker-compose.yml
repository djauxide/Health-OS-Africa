services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-healthos}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-healthos}"
      POSTGRES_DB: "${POSTGRES_DB:-healthos}"
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
      - ./database/002-workflow.sql:/docker-entrypoint-initdb.d/002-workflow.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-healthos} -d ${POSTGRES_DB:-healthos}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      NODE_ENV: "${NODE_ENV:-development}"
      DATABASE_URL: "${DATABASE_URL:-postgres://healthos:healthos@postgres:5432/healthos}"
      JWT_SECRET: "${JWT_SECRET:-change-me-in-production}"
      API_PORT: "4000"
      CORS_ORIGIN: "${CORS_ORIGIN:-http://localhost:3300}"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4400:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:4400}"
    environment:
      NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:4400}"
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3300:3000"

  gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    ports:
      - "8180:80"

volumes:
  postgres_data:
